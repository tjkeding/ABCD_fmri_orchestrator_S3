# ============================================================================
# fmri-first-level-proc template for the ABCD orchestrator (--proc_config); option reference:
# INPUT_SPECIFICATION.md in https://github.com/tjkeding/fmri-first-level-proc
# ============================================================================
# Settings are used as written; the orchestrator fills only __ORCHESTRATOR_FILLED__ fields and run_labels.
# Address outputs by contrast label, never sub-brick index (activation and connectivity statistics differ).
# ============================================================================

# ============================================================================
# global
# ============================================================================
global:
  tr: 0.8
  num_cores: 1
  force_diff_atlas: true
  template_path: "/path/to/Schaefer2018_400Parcels_7Networks_order_Tian_Subcortex_S4_3T_MNI152NLin2009cAsym_2mm.nii.gz"

# ============================================================================
# analyses
# ============================================================================
analyses:

  # ------------------------------------------------------------------
  # nback activation analysis (task_act)
  # ------------------------------------------------------------------
  - name: "nback_act"
    type: "task_act"

    # Censoring: Power FD threshold (50 mm), computed by fmri-first-level-proc
    fd_threshold: 0.9
    censor_prev_tr: false

    # Model
    hrf_model: "GAM"
    custom_hrf: null
    include_motion_derivs: false
    use_tissue_derivs: false

    # Output control
    average_type: "mean"
    scale_to_psc: true
    smoothing:
      enabled: false
    remove_previous: true
    roi_zero_handling: "exclude"

    # Per-run paths (orchestrator-filled placeholders)
    run_labels: [1]
    out_dir: "/__ORCHESTRATOR_FILLED__"
    out_file_pre: "__ORCHESTRATOR_FILLED__"
    paths:
      scan_paths: ["/__ORCHESTRATOR_FILLED__"]
      task_timing_paths: ["/__ORCHESTRATOR_FILLED__"]
      motion_paths: ["/__ORCHESTRATOR_FILLED__"]
      CSF_paths: null
      WM_paths: null

    # Condition labels (0-back pre-block events pooled as target_0back;
    # 2-back pre-block events labeled as instruction)
    cond_labels:
      - "0_back_negface"
      - "0_back_posface"
      - "0_back_neutface"
      - "0_back_place"
      - "2_back_negface"
      - "2_back_posface"
      - "2_back_neutface"
      - "2_back_place"
      - "target_0back"
      - "instruction"

    # 29 contrasts (address by label, never by sub-brick index)
    contrasts:
      labels:
        - "ave_negface"
        - "ave_posface"
        - "ave_neutface"
        - "ave_place"
        - "ave_zback"
        - "ave_tback"
        - "ave_negface-ave_posface"
        - "ave_negface-ave_neutface"
        - "ave_negface-ave_place"
        - "ave_posface-ave_neutface"
        - "ave_posface-ave_place"
        - "ave_neutface-ave_place"
        - "ave_tback-ave_zback"
        - "negface_tback-zback"
        - "posface_tback-zback"
        - "neutface_tback-zback"
        - "place_tback-zback"
        - "zback_negface-posface"
        - "zback_negface-neutface"
        - "zback_negface-place"
        - "zback_posface-neutface"
        - "zback_posface-place"
        - "zback_neutface-place"
        - "tback_negface-posface"
        - "tback_negface-neutface"
        - "tback_negface-place"
        - "tback_posface-neutface"
        - "tback_posface-place"
        - "tback_neutface-place"
      functions:
        - "0.5*0_back_negface+0.5*2_back_negface"
        - "0.5*0_back_posface+0.5*2_back_posface"
        - "0.5*0_back_neutface+0.5*2_back_neutface"
        - "0.5*0_back_place+0.5*2_back_place"
        - "0.25*0_back_negface+0.25*0_back_posface+0.25*0_back_neutface+0.25*0_back_place"
        - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_posface-0.5*2_back_posface"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_neutface-0.5*2_back_neutface"
        - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_place-0.5*2_back_place"
        - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_neutface-0.5*2_back_neutface"
        - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_place-0.5*2_back_place"
        - "0.5*0_back_neutface+0.5*2_back_neutface-0.5*0_back_place-0.5*2_back_place"
        - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place-0.25*0_back_negface-0.25*0_back_posface-0.25*0_back_neutface-0.25*0_back_place"
        - "1*2_back_negface-1*0_back_negface"
        - "1*2_back_posface-1*0_back_posface"
        - "1*2_back_neutface-1*0_back_neutface"
        - "1*2_back_place-1*0_back_place"
        - "1*0_back_negface-1*0_back_posface"
        - "1*0_back_negface-1*0_back_neutface"
        - "1*0_back_negface-1*0_back_place"
        - "1*0_back_posface-1*0_back_neutface"
        - "1*0_back_posface-1*0_back_place"
        - "1*0_back_neutface-1*0_back_place"
        - "1*2_back_negface-1*2_back_posface"
        - "1*2_back_negface-1*2_back_neutface"
        - "1*2_back_negface-1*2_back_place"
        - "1*2_back_posface-1*2_back_neutface"
        - "1*2_back_posface-1*2_back_place"
        - "1*2_back_neutface-1*2_back_place"

    # Extraction
    extraction:
      stat_buckets: ["Coef", "Tstat", "Zstat"]
      extract_out_file_pre: "__ORCHESTRATOR_FILLED__"
      extract_resids: true
      extract_raw_ptseries: true

  # ------------------------------------------------------------------
  # nback connectivity analysis (task_conn)
  # ------------------------------------------------------------------
  - name: "nback_conn"
    type: "task_conn"

    fd_threshold: 0.9
    censor_prev_tr: false

    hrf_model: "GAM"
    custom_hrf: null
    include_motion_derivs: false
    use_tissue_derivs: false

    average_type: "mean"
    scale_to_psc: true
    smoothing:
      enabled: false
    remove_previous: true
    roi_zero_handling: "exclude"

    run_labels: [1]
    out_dir: "/__ORCHESTRATOR_FILLED__"
    out_file_pre: "__ORCHESTRATOR_FILLED__"
    paths:
      scan_paths: ["/__ORCHESTRATOR_FILLED__"]
      task_timing_paths: ["/__ORCHESTRATOR_FILLED__"]
      motion_paths: ["/__ORCHESTRATOR_FILLED__"]
      CSF_paths: null
      WM_paths: null

    # Beta-series labels (target_0back and instruction are modeled upstream
    # as non-beta nuisance regressors, never floor-dropped)
    cond_beta_labels:
      - "0_back_negface"
      - "0_back_posface"
      - "0_back_neutface"
      - "0_back_place"
      - "2_back_negface"
      - "2_back_posface"
      - "2_back_neutface"
      - "2_back_place"

    extraction:
      extract_pbseries: true
      extract_out_file_pre: "__ORCHESTRATOR_FILLED__"
      extract_raw_ptseries: true

    connectivity:
      calc_conn: "parcellated"
      conn_out_file_pre: "__ORCHESTRATOR_FILLED__"
      pcorr: false
      fishZ: true
      # Same 29 contrasts as nback_act (identical label/function order)
      contrasts:
        labels:
          - "ave_negface"
          - "ave_posface"
          - "ave_neutface"
          - "ave_place"
          - "ave_zback"
          - "ave_tback"
          - "ave_negface-ave_posface"
          - "ave_negface-ave_neutface"
          - "ave_negface-ave_place"
          - "ave_posface-ave_neutface"
          - "ave_posface-ave_place"
          - "ave_neutface-ave_place"
          - "ave_tback-ave_zback"
          - "negface_tback-zback"
          - "posface_tback-zback"
          - "neutface_tback-zback"
          - "place_tback-zback"
          - "zback_negface-posface"
          - "zback_negface-neutface"
          - "zback_negface-place"
          - "zback_posface-neutface"
          - "zback_posface-place"
          - "zback_neutface-place"
          - "tback_negface-posface"
          - "tback_negface-neutface"
          - "tback_negface-place"
          - "tback_posface-neutface"
          - "tback_posface-place"
          - "tback_neutface-place"
        functions:
          - "0.5*0_back_negface+0.5*2_back_negface"
          - "0.5*0_back_posface+0.5*2_back_posface"
          - "0.5*0_back_neutface+0.5*2_back_neutface"
          - "0.5*0_back_place+0.5*2_back_place"
          - "0.25*0_back_negface+0.25*0_back_posface+0.25*0_back_neutface+0.25*0_back_place"
          - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_posface-0.5*2_back_posface"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_neutface-0.5*2_back_neutface"
          - "0.5*0_back_negface+0.5*2_back_negface-0.5*0_back_place-0.5*2_back_place"
          - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_neutface-0.5*2_back_neutface"
          - "0.5*0_back_posface+0.5*2_back_posface-0.5*0_back_place-0.5*2_back_place"
          - "0.5*0_back_neutface+0.5*2_back_neutface-0.5*0_back_place-0.5*2_back_place"
          - "0.25*2_back_negface+0.25*2_back_posface+0.25*2_back_neutface+0.25*2_back_place-0.25*0_back_negface-0.25*0_back_posface-0.25*0_back_neutface-0.25*0_back_place"
          - "1*2_back_negface-1*0_back_negface"
          - "1*2_back_posface-1*0_back_posface"
          - "1*2_back_neutface-1*0_back_neutface"
          - "1*2_back_place-1*0_back_place"
          - "1*0_back_negface-1*0_back_posface"
          - "1*0_back_negface-1*0_back_neutface"
          - "1*0_back_negface-1*0_back_place"
          - "1*0_back_posface-1*0_back_neutface"
          - "1*0_back_posface-1*0_back_place"
          - "1*0_back_neutface-1*0_back_place"
          - "1*2_back_negface-1*2_back_posface"
          - "1*2_back_negface-1*2_back_neutface"
          - "1*2_back_negface-1*2_back_place"
          - "1*2_back_posface-1*2_back_neutface"
          - "1*2_back_posface-1*2_back_place"
          - "1*2_back_neutface-1*2_back_place"

  # ------------------------------------------------------------------
  # Resting-state connectivity analysis (rest_conn)
  # ------------------------------------------------------------------
  - name: "rest_conn"
    type: "rest_conn"

    fd_threshold: 0.4
    censor_prev_tr: true

    average_type: "mean"
    scale_to_psc: true
    smoothing:
      enabled: false
    remove_previous: true
    roi_zero_handling: "exclude"

    run_labels: [1]
    out_dir: "/__ORCHESTRATOR_FILLED__"
    out_file_pre: "__ORCHESTRATOR_FILLED__"
    paths:
      scan_paths: ["/__ORCHESTRATOR_FILLED__"]
      motion_paths: ["/__ORCHESTRATOR_FILLED__"]
      CSF_paths: ["/__ORCHESTRATOR_FILLED__"]
      WM_paths: ["/__ORCHESTRATOR_FILLED__"]
      GS_paths: null    # No global signal regression

    # Nuisance model
    bandpass: [0.01, 0.1]
    notch_filter_band: [0.31, 0.43]
    motion_deriv_degree: 2
    use_tissue_derivs: true
    keep_run_res_dtseries: true
    use_sequenced_bandpass: false

    extraction:
      extract_ptseries: true
      extract_out_file_pre: "__ORCHESTRATOR_FILLED__"
      extract_raw_ptseries: true

    connectivity:
      calc_conn: "parcellated"
      conn_out_file_pre: "__ORCHESTRATOR_FILLED__"
      pcorr: false
      fishZ: true
