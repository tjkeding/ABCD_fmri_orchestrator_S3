# ============================================================================
# Orchestrator config for orchestrate_first_level.py (ABCD); the participant comes from --subj_id
# and the analysis template from --proc_config. Local paths must be absolute.
# ============================================================================

# ============================================================================
# study
# ============================================================================
study:

  # Local working directory; each input S3 key is downloaded to {input_dir}/{key}
  input_dir: "/path/to/input"

  # Orchestrator output root (sub-*/ses-*/ directories are created inside)
  output_dir: "/path/to/output"

  # Template space (matches the "space-" entity in input filenames)
  space: "MNI152NLin2009cAsym"

  # Repetition time in seconds
  TR: 0.8

  # Reprocess sessions that already have a _COMPLETE sentinel on S3
  force_recompute: false

# ============================================================================
# tasks
# ============================================================================
tasks:

  # condition_column: events.tsv condition column; conditions_exclude: dropped before modeling;
  # fix_nback_cues: relabel n-back pre-block cue events
  - task_label: "nback"
    condition_column: "trial_type"
    conditions_exclude: ["dummy"]
    fix_nback_cues: true

  - task_label: "rest"

# ============================================================================
# qc
# ============================================================================
qc:

  # Pre-analysis QC per run: tSNR and carpet plot (DVARS trace above a
  # voxel-by-time heatmap)
  preproc:
    enabled: true
    tsnr: true
    carpet_plots: true

  # Per-analysis QC read from the upstream first-level outputs
  first_level:
    enabled: true

# ============================================================================
# analyses
# ============================================================================
# Each entry matches a proc-template analysis block by name. Output prefixes
# are built as "sub-{subj_id}_ses-{session}A_{post_id_*_pre}".
analyses:

  - name: "nback_act"
    type: "task_act"
    task_label: "nback"
    post_id_out_pre: "nback"
    post_id_extract_pre: "nback_SchaeferTian"

  - name: "nback_conn"
    type: "task_conn"
    task_label: "nback"
    post_id_out_pre: "nback"
    post_id_extract_pre: "nback_SchaeferTian"
    post_id_conn_pre: "nback_SchaeferTian"

  - name: "rest_conn"
    type: "rest_conn"
    task_label: "rest"
    post_id_out_pre: "rest"
    post_id_extract_pre: "rest_SchaeferTian"
    post_id_conn_pre: "rest_SchaeferTian"

# ============================================================================
# s3
# ============================================================================
s3:
  # Required; must be true (inputs and outputs live on S3)
  enabled: true

  # Bucket name only (no "s3://" prefix, no slashes)
  bucket: "your-bucket-name"

  # Input prefix templates; both must contain {subject} and {session}. Run
  # files and session tissue masks share one directory per session.
  func_prefix_template: "derivatives/func/sub-{subject}/ses-{session}A"
  anat_prefix_template: "derivatives/func/sub-{subject}/ses-{session}A"

  # Output prefix; a zero-byte _COMPLETE sentinel marks each finished session
  upload_prefix: "derivatives/first_levels"

  # Delete downloaded inputs and local outputs after a successful upload
  cleanup_after_upload: true

  # Concurrent upload threads (default 8, range 1-64)
  upload_max_workers: 8
